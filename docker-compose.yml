services:
  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile.ingestion
    container_name: ingestion
    volumes:
      - ./data:/app/data
      - ./prepared:/app/prepared
    command: ["true"]
    # ingestionは必要時に "docker compose run ingestion python prepare_data.py" のように実行する

  chunker:
    build:
      context: ./chunking
      dockerfile: Dockerfile.chunker
    container_name: chunker
    depends_on:
      - ingestion
    volumes:
      - ./prepared:/app/prepared
      - ./chunks:/app/chunks
    command: ["true"]
    # chunkerも必要時に "docker compose run chunker python make_chunks.py" で実行

  embedding:
    build:
      context: ./embeddings
      dockerfile: Dockerfile.embedding
    container_name: embedding
    depends_on:
      - chunker
    volumes:
      - ./chunks:/app/chunks
      - ./embeddings:/app/embeddings
    command: ["true"]

  db:
    build:
      context: ./db
      dockerfile: Dockerfile.db
    container_name: vehicle_db
    volumes:
      - ./embeddings:/app/embeddings
      - ./db/data:/app/db_data
    command: python run_duckdb.py

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./embeddings:/app/embeddings
      - ./chunks:/app/chunks
      - ./prepared:/app/prepared
      - ./charging:/app/charging
      - ./data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000


