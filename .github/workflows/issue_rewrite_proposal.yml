# =============================================================================
# Issue Rewrite Proposal Workflow
# =============================================================================
#
# このワークフローは以下を自動実行します：
# - 新規 Issue を検出
# - AI（GitHub Models API）を使用して Issue の文章をリライト・改善
# - リライト提案をコメントで投稿
# - ユーザーが `/apply-rewrite` コマンドで適用を指示可能
#
# トリガー条件：
# - 新しい Issue が開かれた時に自動実行
#
# 前提条件：
# - GitHub Copilot が有効であること（GitHub Models API を使用）
# - scripts/rewrite_issue.py がリポジトリに存在
#
# 機能：
# 1. Issue 題名と本文を AI に送信してリライト案を生成
#    - 本文が空の場合は題名から内容を類推
# 2. 提案をコメント形式で Issue に投稿
# 3. ユーザーが `/apply-rewrite` コマンドで提案を確定可能
# =============================================================================

name: Propose Issue Rewrite

on:
  # Issue が新規作成された時にトリガー
  issues:
    types: [opened]

# GitHub API で Issue コメントを作成し、リポジトリのコードにアクセスするための権限を付与
# models: read は GitHub Models API（AI リライト）へのアクセスに必要
permissions:
  contents: read
  issues: write
  models: read

jobs:
  # ===========================================================================
  # ジョブ: propose
  # 目的: 新規 Issue を AI でリライトし、提案コメントを投稿
  # ===========================================================================
  propose:
    runs-on: ubuntu-latest
    steps:
      # リポジトリをチェックアウト（rewrite スクリプトを実行するため）
      - uses: actions/checkout@v4

      # Python 環境のセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Issue 題名と本文を AI でリライト処理
      # 環境変数経由で ISSUE_TITLE, ISSUE_BODY, GITHUB_TOKEN を渡す
      - name: Run rewrite
        id: rewrite
        env:
          # 新規開設された Issue の題名を環境変数に設定
          ISSUE_TITLE: ${{ github.event.issue.title }}
          # 新規開設された Issue の本文を環境変数に設定
          ISSUE_BODY: ${{ github.event.issue.body }}
          # GitHub Token（GitHub Models API の認証に使用）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # rewrite_issue.py を実行してリライト結果を取得
          RESULT=$(python scripts/rewrite_issue.py)
          # 出力を GitHub Actions の output に設定（複数行対応）
          {
            echo "TEXT<<EOF"
            echo "$RESULT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # AI によるリライト提案をコメントで Issue に投稿
      # ユーザーが `/apply-rewrite` コマンドで確定可能な形式
      - name: Post proposal
        uses: actions/github-script@v7
        env:
          PROPOSAL_TEXT: ${{ steps.rewrite.outputs.TEXT }}
        with:
          script: |
            // 環境変数経由でリライト結果を取得（JSテンプレートリテラルの構文エラーを回避）
            const proposalText = process.env.PROPOSAL_TEXT;
            const body = "### 🤖 Issueリライト案（提案）\n\n" +
              "※ 元Issueは変更していません  \n" +
              "問題なければ `/apply-rewrite` とコメントしてください。\n\n" +
              proposalText;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            })
