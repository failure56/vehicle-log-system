# =============================================================================
# Issue Rewrite Apply Workflow
# =============================================================================
#
# このワークフローは以下を自動実行します：
# - Issue コメント内の `/apply-rewrite` コマンドを検出
# - Issue のリライト提案を元の Issue 本文に適用
# - AI によって提案された新しい Issue 内容に更新
#
# トリガー条件：
# - Issue コメントが作成された時に自動検出
# - コメント内に `/apply-rewrite` コマンドがある場合に実行
#
# 使用方法：
# 1. Issue にリライト提案コメントが投稿される
# 2. Issue コメント欄に `/apply-rewrite` とコメント
# 3. このワークフローが自動実行され、Issue 本文が更新される
# =============================================================================

name: Apply Issue Rewrite

on:
  # Issue コメントイベントをトリガーに
  issue_comment:
    types: [created]

# GitHub API で Issue を更新するための権限を付与
permissions:
  issues: write

jobs:
  # ===========================================================================
  # ジョブ: apply
  # 目的: Issue コメントの `/apply-rewrite` コマンドを検出し、リライト提案を適用
  # ===========================================================================
  apply:
    # `/apply-rewrite` コマンドがコメント内に含まれる場合のみ実行
    if: contains(github.event.comment.body, '/apply-rewrite')
    runs-on: ubuntu-latest
    steps:
      # Issue コメントからリライト提案を取得し、Issue 本文に適用
      - name: Apply rewrite
        uses: actions/github-script@v7
        with:
          script: |
            # 対象 Issue のすべてのコメントを取得（新しい順に並び替え）
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            })

            # "## 概要" という見出しを含むコメント（リライト提案）を検索
            # reverse() で最新のコメントから順に確認
            const proposal = comments.data.reverse()
              .find(c => c.body.includes("## 概要"))

            # リライト提案が見つからない場合はエラー終了
            if (!proposal) {
              core.setFailed("Rewrite proposal not found")
              return
            }

            # 提案コメントから "### 🤖 Issueリライト案（提案）" という見出しより前の部分を削除
            # つまり、提案の本体部分のみを抽出
            const body = proposal.body
              .replace(/^### 🤖 Issueリライト案（提案）[\\s\\S]*?\\n\\n/, "")

            # 抽出した内容で Issue 本文を更新
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            })
