# =============================================================================
# Issue Rewrite Apply Workflow
# =============================================================================
#
# このワークフローは以下を自動実行します：
# - Issue コメント内の `/apply-rewrite` コマンドを検出
# - Issue のリライト提案を元の Issue 本文に適用
# - AI によって提案された新しい Issue 内容に更新
# - 提案コメントを削除
#
# トリガー条件：
# - Issue コメントが作成された時に自動検出
# - コメント内に `/apply-rewrite` コマンドがある場合に実行
#
# 使用方法：
# 1. Issue にリライト提案コメントが投稿される
# 2. Issue コメント欄に `/apply-rewrite` とコメント
# 3. このワークフローが自動実行され、Issue 本文が更新される
# 4. 提案コメントが削除される
# =============================================================================

name: Apply Issue Rewrite

on:
  # Issue コメントイベントをトリガーに
  issue_comment:
    types: [created]

# GitHub API で Issue を更新するための権限を付与
permissions:
  issues: write

jobs:
  # ===========================================================================
  # ジョブ: apply
  # 目的: Issue コメントの `/apply-rewrite` コマンドを検出し、リライト提案を適用
  # ===========================================================================
  apply:
    # `/apply-rewrite` コマンドがコメント内に含まれ、かつ Issue に対するコメントの場合のみ実行
    if: contains(github.event.comment.body, '/apply-rewrite') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # Issue コメントからリライト提案を取得し、Issue 本文に適用
      - name: Apply rewrite
        uses: actions/github-script@v7
        with:
          script: |
            // 対象 Issue のすべてのコメントを取得（新しい順に並び替え）
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            })

            // "🤖 Issueリライト案" ヘッダーを含むコメント（リライト提案）を検索
            // reverse() で最新のコメントから順に確認
            const PROPOSAL_MARKER = "🤖 Issueリライト案"
            const proposal = comments.data.reverse()
              .find(c => c.body.includes(PROPOSAL_MARKER))

            // リライト提案が見つからない場合はエラー終了
            if (!proposal) {
              core.setFailed("Rewrite proposal not found")
              return
            }

            // 提案コメントからヘッダーと説明文を除去し、リライト本文のみを抽出
            // "## 概要" から始まる部分を抽出（AI出力の本文部分）
            const match = proposal.body.match(/^(## 概要[\s\S]*)$/m)
            if (!match) {
              core.setFailed("Could not extract rewrite body from proposal comment")
              return
            }
            const body = match[1].trim()

            // 抽出した内容で Issue 本文を更新
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            })

            // 提案コメントを削除
            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: proposal.id
            })
