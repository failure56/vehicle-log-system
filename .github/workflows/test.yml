name: Run Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # -----------------------------------------------------------------
  # ユニットテスト (pytest)
  # -----------------------------------------------------------------
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create work directory
        run: mkdir -p work

      - name: Run pytest (skip slow tests)
        run: pytest -m "not slow"

      # --- テスト結果を Checks タブに表示 ---
      - name: Test Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const extractAttributes = (xml, tagName) => {
              const tagMatch = xml.match(new RegExp(`<${tagName}\\b([^>]*)>`, 'i'));
              if (!tagMatch) {
                return {};
              }

              return Object.fromEntries(
                Array.from(
                  tagMatch[1].matchAll(/([\\w:-]+)="([^"]*)"/g),
                  ([, key, value]) => [key, value],
                ),
              );
            };

            const testReportPath = 'work/test-results.xml';
            if (!fs.existsSync(testReportPath)) {
              core.warning(`Test report not found: ${testReportPath}`);
              return;
            }

            const xml = fs.readFileSync(testReportPath, 'utf8');
            const testsuitesAttrs = extractAttributes(xml, 'testsuites');
            const testsuiteAttrs = extractAttributes(xml, 'testsuite');
            const testAttrs = Object.keys(testsuitesAttrs).length > 0 ? testsuitesAttrs : testsuiteAttrs;

            const tests = Number.parseInt(testAttrs.tests || '0', 10);
            const failures = Number.parseInt(testAttrs.failures || '0', 10);
            const errors = Number.parseInt(testAttrs.errors || '0', 10);
            const skipped = Number.parseInt(testAttrs.skipped || '0', 10);
            const passed = tests - failures - errors - skipped;
            const duration = testAttrs.time || '0';
            const conclusion = failures > 0 || errors > 0 ? 'failure' : 'success';

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Pytest Results',
              head_sha: context.payload.pull_request?.head?.sha || context.sha,
              status: 'completed',
              conclusion,
              output: {
                title: 'Pytest Results',
                summary: [
                  '## Pytest Results',
                  '',
                  `- Passed: ${passed}`,
                  `- Failed: ${failures}`,
                  `- Errors: ${errors}`,
                  `- Skipped: ${skipped}`,
                  `- Duration: ${duration}s`,
                ].join('\n'),
                text: `Source: \`${testReportPath}\``,
              },
            });

      # --- カバレッジを Job Summary に表示 ---
      - name: Coverage Summary
        if: always()
        run: |
          echo "## :test_tube: テスト結果サマリー" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # テスト件数の集計
          if [ -f work/test-results.xml ]; then
            TESTS=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('work/test-results.xml')
          root = tree.getroot()
          ts = root.get('tests', '0')
          fl = root.get('failures', '0')
          er = root.get('errors', '0')
          sk = root.get('skipped', '0')
          tm = root.get('time', '0')
          passed = int(ts) - int(fl) - int(er) - int(sk)
          print(f'| :white_check_mark: Passed | {passed} |')
          print(f'| :x: Failed | {fl} |')
          print(f'| :warning: Errors | {er} |')
          print(f'| :fast_forward: Skipped | {sk} |')
          print(f'| :stopwatch: Time | {tm}s |')
          ")
            echo "### テスト" >> "$GITHUB_STEP_SUMMARY"
            echo "| Status | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "$TESTS" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          # カバレッジの集計
          if [ -f work/coverage.xml ]; then
            COV=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('work/coverage.xml')
          root = tree.getroot()
          rate = float(root.get('line-rate', '0'))
          pct = rate * 100
          print(f'{pct:.1f}')
          ")
            echo "COVERAGE_PCT=${COV}" >> "$GITHUB_ENV"
            echo "### カバレッジ" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            # バッジ風表示
            if (( $(echo "$COV >= 80" | bc -l) )); then
              echo ":green_circle: **${COV}%**" >> "$GITHUB_STEP_SUMMARY"
            elif (( $(echo "$COV >= 60" | bc -l) )); then
              echo ":yellow_circle: **${COV}%**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo ":red_circle: **${COV}%**" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"

            # モジュール別カバレッジテーブル
            echo "| Module | Stmts | Miss | Cover |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|------|-------|" >> "$GITHUB_STEP_SUMMARY"
            python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('work/coverage.xml')
          for pkg in tree.findall('.//package'):
            for cls in pkg.findall('.//class'):
              name = cls.get('filename', '')
              lr = float(cls.get('line-rate', '0')) * 100
              lines = cls.findall('.//line')
              total = len(lines)
              miss = sum(1 for l in lines if l.get('hits') == '0')
              print(f'| \`{name}\` | {total} | {miss} | {lr:.0f}% |')
          " >> "$GITHUB_STEP_SUMMARY"
          fi

      # --- PR にカバレッジコメントを投稿 ---
      - name: Coverage PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- vehicle-log-system:test-report -->';

            const extractAttributes = (xml, tagName) => {
              const tagMatch = xml.match(new RegExp(`<${tagName}\\b([^>]*)>`, 'i'));
              if (!tagMatch) {
                return {};
              }

              return Object.fromEntries(
                Array.from(
                  tagMatch[1].matchAll(/([\\w:-]+)="([^"]*)"/g),
                  ([, key, value]) => [key, value],
                ),
              );
            };
            
            let coverage = 'N/A';
            let testSummary = '';
            
            // Parse coverage.xml
            if (fs.existsSync('work/coverage.xml')) {
              const coverageXml = fs.readFileSync('work/coverage.xml', 'utf8');
              const coverageAttrs = extractAttributes(coverageXml, 'coverage');
              const rate = parseFloat(coverageAttrs['line-rate'] || '0') * 100;
              coverage = rate.toFixed(1);
            }
            
            // Parse test-results.xml
            if (fs.existsSync('work/test-results.xml')) {
              const testXml = fs.readFileSync('work/test-results.xml', 'utf8');
              const testsuiteAttrs = extractAttributes(testXml, 'testsuites');
              const fallbackAttrs = extractAttributes(testXml, 'testsuite');
              const testAttrs = Object.keys(testsuiteAttrs).length > 0 ? testsuiteAttrs : fallbackAttrs;
              const ts = testAttrs.tests || '0';
              const fl = testAttrs.failures || '0';
              const er = testAttrs.errors || '0';
              const sk = testAttrs.skipped || '0';
              const passed = parseInt(ts, 10) - parseInt(fl, 10) - parseInt(er, 10) - parseInt(sk, 10);
              testSummary = `✅ Passed: ${passed} | ❌ Failed: ${fl} | ⚠️ Errors: ${er} | ⏭️ Skipped: ${sk}`;
            }
            
            const comment = [
              marker,
              '## 📊 テストカバレッジレポート',
              '',
              testSummary || 'テスト結果が利用できません。',
              '',
              `**カバレッジ**: ${coverage}%`,
              '',
              `_Workflow run: ${context.runNumber}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existingComment = comments.find((entry) =>
              entry.user?.type === 'Bot' && entry.body?.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment,
              });
            }

      # --- カバレッジバッジを gist に保存 ---
      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: vehicle-log-system-coverage.json
          label: coverage
          message: ${{ env.COVERAGE_PCT }}%
          valColorRange: ${{ env.COVERAGE_PCT }}
          minColorRange: 40
          maxColorRange: 90

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: work/
          retention-days: 14

  # -----------------------------------------------------------------
  # Docker ビルド検証
  # -----------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all Docker images
        run: docker compose build
