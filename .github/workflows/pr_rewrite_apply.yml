# =============================================================================
# Pull Request Rewrite Apply Workflow
# =============================================================================
#
# このワークフローは以下を自動実行します：
# - PR コメント内の `/apply-rewrite` コマンドを検出
# - PR のリライト提案を元の PR 説明に適用
# - AI によって提案された新しい PR 内容に更新
# - 提案コメントを削除
#
# トリガー条件：
# - Issue コメントが作成された時に自動検出（PR のコメントも issue_comment イベントで検出される）
# - コメント内に `/apply-rewrite` コマンドがある場合に実行
#
# 使用方法：
# 1. PR にリライト提案コメントが投稿される
# 2. PR コメント欄に `/apply-rewrite` とコメント
# 3. このワークフローが自動実行され、PR 説明が更新される
# 4. 提案コメントが削除される
# =============================================================================

name: Apply PR Rewrite

on:
  # Issue コメントイベントをトリガーに（PR のコメントも含む）
  issue_comment:
    types: [created]

# GitHub API で PR を更新し、コメントを削除するための権限を付与
permissions:
  pull-requests: write
  issues: write

jobs:
  # ===========================================================================
  # ジョブ: apply
  # 目的: PR コメントの `/apply-rewrite` コマンドを検出し、リライト提案を適用
  # ===========================================================================
  apply:
    # `/apply-rewrite` コマンドがコメント内に含まれ、かつ PR に対するコメントの場合のみ実行
    if: contains(github.event.comment.body, '/apply-rewrite') && github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # PR コメントからリライト提案を取得し、PR 説明に適用
      - name: Apply rewrite
        uses: actions/github-script@v7
        with:
          script: |
            // 対象 PR のすべてのコメントを取得（新しい順に並び替え）
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            })

            // "🤖 PRリライト案" ヘッダーを含むコメント（リライト提案）を検索
            // reverse() で最新のコメントから順に確認
            const PROPOSAL_MARKER = "🤖 PRリライト案"
            const proposal = comments.data.reverse()
              .find(c => c.body.includes(PROPOSAL_MARKER))

            // リライト提案が見つからない場合はエラー終了
            if (!proposal) {
              core.setFailed("Rewrite proposal not found")
              return
            }

            // 提案コメントからヘッダーと説明文を除去し、リライト本文のみを抽出
            // "## 概要" から始まる部分を抽出（AI出力の本文部分）
            const match = proposal.body.match(/^(## 概要[\s\S]*)$/m)
            if (!match) {
              core.setFailed("Could not extract rewrite body from proposal comment")
              return
            }
            const body = match[1].trim()

            // 抽出した内容で PR 説明を更新
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body
            })

            // 提案コメントを削除
            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: proposal.id
            })
